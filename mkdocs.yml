site_name: Awesome Open Source AI
site_description: A curated list of awesome open source AI projects
site_author: BzsClaw
repo_url: https://github.com/BzsClaw/awesome-opensource-ai
repo_name: BzsClaw/awesome-opensource-ai

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - search.share

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md